[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgate-mri"
version = "0.1.0"
description = "Quality-aware expert routing with calibrated confidence gating for brain tumour MRI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Everything below is optional on purpose: the core pipeline (quality metrics,
# router, calibration, fusion, gate, selective-prediction metrics) is numpy-only
# so it runs and is testable without a deep-learning stack.
sci = ["scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0", "matplotlib>=3.7"]
io = ["nibabel>=5.0", "SimpleITK>=2.3"]
radiomics = ["pyradiomics>=3.1", "xgboost>=2.0"]
torch = ["torch>=2.2", "timm>=0.9"]
# Report generation is optional on the same grounds: the template path stays
# numpy-only, and only the VLM phrase layer needs the transformers stack.
vlm = ["transformers>=4.45", "accelerate>=0.33", "pillow>=9"]
dev = ["pytest>=7.4"]

[project.scripts]
cgate = "cgate.experiments.run:main"
cgate-report = "cgate.reporting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Numeric code must not warn: a RuntimeWarning here means a divide-by-zero or
# invalid value reached a metric, which silently corrupts calibration numbers.
filterwarnings = ["error::RuntimeWarning"]
markers = ["slow: end-to-end runs that fit models (deselect with -m 'not slow')"]
